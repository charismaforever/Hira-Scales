<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hirajoshi Scale Explorer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>平調子 — Hirajoshi Scale Explorer</h1>
    <p>Japanese pentatonic scale • 1 2 ♭3 5 ♭6</p>
  </header>

  <div class="controls">
    <label>Root Note:
      <select id="root"></select>
    </label>
    <button id="play-scale">▶ Play Scale</button>
    <button id="play-arpeggio">Arpeggio</button>
  </div>

  <div class="visuals">
    <div class="piano" id="piano"></div>
    <div class="guitar" id="guitar"></div>
  </div>

  <div class="info">
    <h2>Notes</h2>
    <p id="notes-display"></p>
    
    <h2>Intervals</h2>
    <p>Whole • Half • Whole+Whole • Half • Whole+Whole (W h 4 h 4)</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
